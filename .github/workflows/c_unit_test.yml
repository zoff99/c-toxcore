name: c unit test
on:
  push:
    paths-ignore:
     - 'README.md'
  pull_request:
    paths-ignore:
     - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: dummy
        default: dummy

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: run unit tests
      run: |
        pwd
        cd unit_test/
        make test

    - name: run asan and ubsan unit tests
      run: |
        pwd
        cd unit_test/
        make clean
        make test_san

    - name: run fuzzer saved crashes
      run: |
        pwd
        cd unit_fuzz/
        make clean
        make regress

